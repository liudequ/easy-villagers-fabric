name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Mod Jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Minecraft & Fabric dependencies
        uses: actions/cache@v4
        with:
          path: .cache
          key: mc-deps-${{ runner.os }}-1.20.1-v1
          restore-keys: |
            mc-deps-${{ runner.os }}-1.20.1-

      - name: Make scripts executable
        run: |
          chmod +x build.sh
          chmod +x package.sh

      - name: Build Mod
        run: ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-villagers-fabric-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: easy-villagers-fabric-${{ github.ref_name }}
          path: build/libs

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Easy Villagers (Fabric) ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          files: build/libs/*.jar
          generate_release_notes: false
          body: |
            # 🌾 Easy Villagers (Fabric) ${{ github.ref_name }}

            A modern, lag-free, single-block villager ecosystem for **Minecraft 1.20.1 (Fabric)**.
            专为 Minecraft 1.20.1 Fabric 打造的现代化、零卡顿、单方块村民生态模组。

            ---

            ### 🚀 What's Included / 包含的核心方块与特性

            - 🎒 **Villager Item (随身抓取)**: 潜行右键收纳村民，完整保留等级/折扣/NBT，安全释放。
            - 🏪 **Trader Showcase (交易展柜)**: 1x1 微缩展柜，容纳村民与工作台，1 秒取放讲台极速洗出完美附魔书。
            - 🤖 **Auto Trader (全自动交易展柜)**: 支持漏斗输入输出，红石锁定交易，全天候定时自动兑换与补货。
            - 💕 **Breeder (村民繁殖机)**: 容纳 2 只村民，消耗面包/胡萝卜/马铃薯/甜菜根，20 秒产出幼年村民。
            - 🍼 **Incubator (幼体催熟机)**: 暖光干草底座，将幼年村民催熟时间从 20 分钟极速缩短至 30 秒。
            - 🧪 **Converter (僵尸转化机)**: 全自动虚弱+金苹果治愈村民，赋予**全交易永久 1 绿宝石骨折特惠**。
            - ⚙️ **Iron Farm (单方块刷铁机)**: 容纳 1 只村民，每 10 秒稳定产出 3~5 铁锭与虞美人，彻底告别实体 AI 寻路卡顿。
            - 🌾 **Farmer (自动农夫方块)**: 容纳 1 只农民村民，周期性全自动收割并增殖各类农作物。
            - 🔎 **未来交易预览**: 普通村民与两种交易展柜内置后续等级预览；未解锁条目置灰且服务端禁止兑换，升级兑现已预览商品。

            ---

            ### 📦 Installation / 安装说明

            1. 下载下方 Assets 中与当前版本对应的 `easy-villagers-fabric-*.jar`；
            2. 将其放入你的 Minecraft `mods/` 文件夹；
            3. 确保已安装 **Fabric Loader (0.15.0+)** 和 **Fabric API**；
            4. 服务端与客户端均更新，移除旧版本及独立的 **Visible Traders** 模组。
